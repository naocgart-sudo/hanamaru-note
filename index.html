<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F8F3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>はなまるノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
:root{
  --paper:#F5F8F3; --card:#FFFFFF; --grid:rgba(43,108,176,.075); --ink:#1D2731; --ink2:#5A6671; --line:#D6DED6;
  --red:#E0463C; --red-soft:#FDE7E4;
  --math:#2B6CB0; --math-bg:#E4EEFA; --eng:#2A7F55; --eng-bg:#E0F2E8; --rev:#B8620A; --rev-bg:#FBEBD5;
  --ok:#2A7F55; --ng:#C23B3B; --gold:#E3A008;
  --dot-a:#2B6CB0; --dot-b:#E0782C; --dot-empty:#D6DED6;
  --shadow:0 2px 0 rgba(29,39,49,.10), 0 6px 18px rgba(29,39,49,.06);
  --r:18px;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-disp:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-en:"Andika","BIZ UDPGothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#2C3A35; --card:#38483F; --grid:rgba(255,255,255,.045); --ink:#F2F5F0; --ink2:#C0CCC4; --line:#4E6158;
    --red:#FF7B6E; --red-soft:#523835;
    --math:#90BBF3; --math-bg:#34495C; --eng:#80D3A5; --eng-bg:#2F4B3C; --rev:#F3B465; --rev-bg:#4D3F2A;
    --ok:#80D3A5; --ng:#FF8C8C; --gold:#F6C453;
    --dot-a:#90BBF3; --dot-b:#F3A86A; --dot-empty:#56695F;
    --shadow:0 2px 0 rgba(0,0,0,.2), 0 6px 16px rgba(0,0,0,.15);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#2C3A35; --card:#38483F; --grid:rgba(255,255,255,.045); --ink:#F2F5F0; --ink2:#C0CCC4; --line:#4E6158;
  --red:#FF7B6E; --red-soft:#523835;
  --math:#90BBF3; --math-bg:#34495C; --eng:#80D3A5; --eng-bg:#2F4B3C; --rev:#F3B465; --rev-bg:#4D3F2A;
  --ok:#80D3A5; --ng:#FF8C8C; --gold:#F6C453;
  --dot-a:#90BBF3; --dot-b:#F3A86A; --dot-empty:#56695F;
  --shadow:0 2px 0 rgba(0,0,0,.2), 0 6px 16px rgba(0,0,0,.15);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--math);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;min-height:100%}
.en{font-family:var(--f-en)}
ruby rt{font-size:.5em;color:var(--ink2);font-weight:400}
.hide-furi rt{display:none}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em;font-size:.85em}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--f-disp);font-weight:900;font-size:22px;margin:0;letter-spacing:.02em}
.brand small{display:block;font-size:13px;color:var(--ink2);font-weight:400;letter-spacing:0}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

/* stamp card */
.stampcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 12px;margin-bottom:14px}
.stamphead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.stamphead b{font-family:var(--f-disp);font-size:16px}
.streak{font-size:14px;color:var(--ink2)}
.streak strong{font-family:var(--f-disp);font-size:24px;color:var(--red);font-variant-numeric:tabular-nums}
.stars{font-size:14px;color:var(--ink2)}
.stars strong{font-family:var(--f-disp);font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink2)}
.day .slot{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;position:relative}
.day.is-today .slot{border-color:var(--ink2);border-style:solid}
.day .slot svg{width:100%;height:100%}
.stamp-in{animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{0%{transform:scale(2.2) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-8deg)}}

/* main cards */
.today{border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.today .label{font-size:13px;font-weight:700;color:var(--red);letter-spacing:.08em}
.today h2{font-family:var(--f-disp);font-weight:900;font-size:24px;margin:2px 0 6px;text-wrap:balance;line-height:1.35}
.today .msg{background:var(--red-soft);border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0 12px;position:relative}
.today .msg::before{content:"パパより";display:block;font-size:11px;font-weight:700;color:var(--red);letter-spacing:.1em;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.chip.math{background:var(--math-bg);border-color:transparent;color:var(--math)}
.chip.english{background:var(--eng-bg);border-color:transparent;color:var(--eng)}
.bigbtn{width:100%;min-height:58px;border:none;border-radius:16px;background:var(--ink);color:var(--paper);font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:.05em;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.bigbtn.red{background:var(--red);color:#fff}
.bigbtn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.bigbtn[disabled]{opacity:.4}
.done-mark{position:absolute;right:4px;top:4px;width:92px;height:auto;opacity:.9;pointer-events:none}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{border:none;border-radius:var(--r);padding:14px;text-align:left;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile b{font-family:var(--f-disp);font-size:18px;font-weight:900;line-height:1.3}
.tile span{font-size:13px;opacity:.85}
.tile .num{font-family:var(--f-disp);font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.tile.math{background:var(--math-bg);color:var(--math)}
.tile.english{background:var(--eng-bg);color:var(--eng)}
.tile.review{background:var(--rev-bg);color:var(--rev)}
.tile.plain{background:var(--card);color:var(--ink)}

.sectitle{font-family:var(--f-disp);font-weight:900;font-size:18px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:none;border-radius:14px;padding:12px 14px;text-align:left;box-shadow:var(--shadow);width:100%}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px}
.row .t small{color:var(--ink2);font-size:13px}
.row .badge{font-family:var(--f-disp);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;color:var(--red)}
.back{display:inline-flex;align-items:center;gap:6px;border:none;background:none;padding:8px 0;font-size:15px;color:var(--ink2)}
.muted{color:var(--ink2);font-size:14px}

.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.skill{border:none;border-radius:14px;padding:12px;text-align:left;box-shadow:var(--shadow);background:var(--card);min-height:76px;display:flex;flex-direction:column;gap:2px}
.skill b{font-size:16px}
.skill small{font-size:12.5px;color:var(--ink2);line-height:1.4}
.skill .ex{font-family:var(--f-disp);font-weight:700;font-size:15px;color:var(--math)}
.skill.english .ex{color:var(--eng);font-family:var(--f-en)}
.danrow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.dan{min-width:52px;height:48px;border-radius:12px;border:none;background:var(--math-bg);color:var(--math);font-family:var(--f-disp);font-weight:900;font-size:17px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;display:flex;gap:3px;height:12px}
.bar i{flex:1;border-radius:6px;background:var(--line);transition:background .3s}
.bar i.ok{background:var(--ok)}
.bar i.ng{background:var(--rev)}
.bar i.now{background:var(--ink2)}
.qcount{font-family:var(--f-disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink2);min-width:3.5em;text-align:right}
.qcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 16px;position:relative;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.qsub{font-size:13px;font-weight:700;letter-spacing:.08em;padding:2px 10px;border-radius:99px}
.qsub.math{background:var(--math-bg);color:var(--math)}
.qsub.english{background:var(--eng-bg);color:var(--eng)}
.qsub.review{background:var(--rev-bg);color:var(--rev)}
.prompt{font-size:22px;line-height:1.6;font-weight:700;text-wrap:balance;max-width:100%;overflow-wrap:anywhere}
.prompt.big{font-family:var(--f-disp);font-size:clamp(36px,11vw,52px);font-weight:900;letter-spacing:.03em;line-height:1.3;font-variant-numeric:tabular-nums}
.prompt .en,.opt .en{font-family:var(--f-en)}
.speak{display:inline-flex;align-items:center;gap:8px;border:none;background:var(--eng-bg);color:var(--eng);border-radius:99px;padding:10px 18px;font-weight:700;font-size:16px}
.speak svg{width:24px;height:24px}
.speak.slow{background:transparent;border:1.5px solid var(--eng);padding:8px 14px;font-size:14px}
.speakrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hintbtn{border:1.5px dashed var(--ink2);background:none;border-radius:99px;padding:6px 16px;font-size:14px;color:var(--ink2)}
.visual{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:100%}
.frames{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;border:2px solid var(--line);border-radius:8px}
.frame i{width:22px;height:22px;border-radius:50%;background:transparent;border:2px dashed var(--dot-empty)}
.frame i.a{background:var(--dot-a);border-color:var(--dot-a)}
.frame i.b{background:var(--dot-b);border-color:var(--dot-b)}
.frame i.x{position:relative;opacity:.35}
.frame i.x::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:3px;background:var(--red);transform:rotate(-45deg)}
.arr{display:grid;gap:3px}
.arr i{width:14px;height:14px;border-radius:50%;background:var(--dot-a)}
.vcap{font-size:13px;color:var(--ink2)}
.maru{overflow:visible}
.maru path{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.maru path.petal{stroke-width:5}
.maru.draw path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw .75s ease-out forwards}
.maru.draw path.petal{animation-delay:.25s;animation-duration:.6s}
.hanamaru{position:absolute;inset:0;margin:auto;width:min(260px,80%);height:auto;pointer-events:none;z-index:3}
@keyframes draw{to{stroke-dashoffset:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.answer{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.boxes{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:18px;font-weight:700}
.box{min-width:96px;height:68px;border-radius:14px;border:3px solid var(--line);background:var(--card);font-family:var(--f-disp);font-weight:900;font-size:38px;display:grid;place-items:center;padding:0 12px;font-variant-numeric:tabular-nums}
.box.active{border-color:var(--math);box-shadow:0 0 0 4px var(--math-bg)}
.box.empty::after{content:"?";color:var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:62px;border:none;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-family:var(--f-disp);font-weight:900;font-size:28px;font-variant-numeric:tabular-nums}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad button.del{font-size:18px;color:var(--ink2)}
.pad button.go{background:var(--ink);color:var(--paper);font-size:19px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:64px;border:2.5px solid var(--line);background:var(--card);border-radius:16px;font-size:21px;font-weight:700;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .08s}
.opt:active{transform:scale(.97)}
.opt.right{border-color:var(--ok);background:var(--eng-bg)}
.opt.wrong{border-color:var(--ng);opacity:.6}
.optrow{display:flex;gap:8px;align-items:stretch}
.optrow .opt{flex:1}
.optrow .say{width:60px;border-radius:16px;border:none;background:var(--eng-bg);color:var(--eng);display:grid;place-items:center}
.optrow .say svg{width:24px;height:24px}
.line{min-height:62px;border-bottom:3px solid var(--ink2);display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;justify-content:center;padding:6px 4px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.word{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-family:var(--f-en);font-size:21px;font-weight:700;box-shadow:var(--shadow)}
.word.used{visibility:hidden}
.textin{width:100%;height:62px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--f-en);font-size:26px;text-align:center;padding:0 12px}
.selfans{background:var(--paper);border-radius:14px;padding:12px;font-size:20px;font-weight:700;text-align:center}
.selfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1)}
.sheet.show{transform:none}
.sheet .in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0;font-family:var(--f-disp);font-weight:900;font-size:26px}
.sheet.good h3{color:var(--ok)}
.sheet.bad h3{color:var(--rev)}
.sheet .correct{font-size:18px}
.sheet .correct b{font-family:var(--f-disp);font-size:26px;color:var(--ink);margin-left:6px}
.steps{margin:0;padding:10px 12px 10px 34px;background:var(--paper);border-radius:12px;font-size:17px;line-height:1.8}
.steps li::marker{font-family:var(--f-disp);font-weight:700;color:var(--ink2)}

/* result */
.result{text-align:center;padding-top:10px;display:flex;flex-direction:column;gap:14px;align-items:center}
.result h2{font-family:var(--f-disp);font-weight:900;font-size:30px;margin:0}
.bigmaru{width:200px;height:200px;position:relative}
.bigmaru svg{width:100%;height:100%}
.bigmaru .score{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:44px;color:var(--red);font-variant-numeric:tabular-nums}
.bigmaru .score small{display:block;font-size:16px;color:var(--ink2);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:var(--card);border-radius:14px;padding:10px 6px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-disp);font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink2)}
.starpop{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:30px}
.starpop svg{width:26px;height:26px;animation:pop .4s cubic-bezier(.2,1.8,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.report{font-size:14px;color:var(--ink2)}
.btncol{display:flex;flex-direction:column;gap:10px;width:100%}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.set label{flex:1}
.set input[type=checkbox]{width:26px;height:26px;accent-color:var(--ink)}
.set select{font:inherit;padding:6px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.danger{color:var(--ng);border-color:var(--ng)!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:15px;z-index:40;transition:transform .25s;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---- v2: 情報量を減らしたレイアウト・イラスト・英語の音 ---- */
.center{text-align:center}
.pbar{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .4s ease}
.tile{min-height:132px;position:relative;justify-content:flex-end;gap:6px}
.tile .art{position:absolute;right:8px;top:8px;width:68px;height:68px}
.tile .art svg{width:100%;height:100%}
.tile b{font-size:19px;position:relative}
.tile:active .art{transform:rotate(-8deg) scale(1.05)}
.tile .art{transition:transform .2s}
.badge-n{position:absolute;left:12px;top:12px;min-width:30px;height:30px;border-radius:15px;background:var(--rev);color:#fff;font-family:var(--f-disp);font-weight:900;font-size:17px;display:grid;place-items:center;padding:0 8px}
.subicons{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px;align-items:center}
.subicon{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;padding:2px 10px 2px 4px;border-radius:99px}
.subicon svg{width:26px;height:26px}
.subicon.math{background:var(--math-bg);color:var(--math)}
.subicon.english{background:var(--eng-bg);color:var(--eng)}
.grp{display:flex;align-items:center;gap:14px;border:none;border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow);text-align:left;min-height:84px;width:100%}
.grp .art{width:58px;height:58px;flex:none}
.grp .art svg{width:100%;height:100%}
.grp b{font-family:var(--f-disp);font-size:19px;font-weight:900}
.grp.math{background:var(--math-bg);color:var(--math)}
.grp.english{background:var(--eng-bg);color:var(--eng)}
.skill b.en{font-family:var(--f-en);font-size:26px}
.qcard.calm{min-height:260px}
.restart{width:160px;max-width:60%}

<script>
/* はなまるノート — core */
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad2 = n => String(n).padStart(2, '0');

const store = {
  get(k, def) { try { const v = localStorage.getItem('hm_' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('hm_' + k, JSON.stringify(v)); } catch (e) {} }

/* 画面の明るさ：明るい（初期）／暗い／スマホに合わせる */
function applyTheme() {
  const r = document.documentElement;
  if (settings.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', settings.theme === 'dark' ? 'dark' : 'light');
  const m = document.querySelector('meta[name=theme-color]');
  const dark = settings.theme === 'dark' || (settings.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  if (m) m.setAttribute('content', dark ? '#2C3A35' : '#F5F8F3');
}
applyTheme();

/* ---------- text formatting ----------
   {漢字|かんじ} → ふりがな   [[3/4]] → 分数   英字は自動で英語フォント */
function plain(t) {
  return t.split(/([A-Za-z][A-Za-z'’,.!?\-/ ]*)/).map((p, i) => i % 2 ? `<span class="en">${esc(p)}</span>` : esc(p)).join('').replace(/\n/g, '<br>');
}
function fmt(s) {
  s = String(s ?? ''); let out = '', last = 0, m;
  const re = /\{([^|{}]+)\|([^{}]+)\}|\[\[(\d+)\/(\d+)\]\]|__([^_\n]+)__/g;
  while ((m = re.exec(s))) {
    out += plain(s.slice(last, m.index));
    out += m[1] ? `<ruby>${esc(m[1])}<rt>${esc(m[2])}</rt></ruby>` : m[5] ? `<u class="ul">${fmt(m[5])}</u>` : `<span class="frac"><span>${m[3]}</span><span>${m[4]}</span></span>`;
    last = re.lastIndex;
  }
  return out + plain(s.slice(last));
}
const bare = s => String(s ?? '').replace(/__([^_\n]+)__/g, '$1').replace(/\{([^|{}]+)\|[^{}]+\}/g, '$1').replace(/\[\[(\d+)\/(\d+)\]\]/g, '$1/$2');

/* ---------- icons ---------- */
const ICON = {

  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',

  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="var(--gold)"/></svg>',

}
/* 赤ペンのはなまる（うずまき＋花びら） */
function hanamaruPath(cx = 130, cy = 120) {
  let d = '', turns = 1.35, steps = 90;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, a = -Math.PI / 2 + t * turns * Math.PI * 2 + 0.6, r = 18 + t * 62;
    const x = cx + Math.cos(a) * r * 1.12, y = cy + Math.sin(a) * r;
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  let p = '', N = 11, R = 94;
  for (let i = 0; i <= N; i++) {
    const a = -Math.PI / 2 + i / N * Math.PI * 2 + 0.3, x = cx + Math.cos(a) * R * 1.1, y = cy + Math.sin(a) * R;
    if (!i) { p += `M${x.toFixed(1)} ${y.toFixed(1)}`; continue; }
    const am = a - Math.PI / N, cxp = cx + Math.cos(am) * (R + 34) * 1.1, cyp = cy + Math.sin(am) * (R + 34);
    p += `Q${cxp.toFixed(1)} ${cyp.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  return { spiral: d, petals: p };
}
function hanamaruSVG(cls = 'draw hanamaru') {
  const h = hanamaruPath();
  return `<svg class="maru ${cls}" viewBox="0 0 260 240" aria-hidden="true"><path d="${h.spiral}"/><path class="petal" d="${h.petals}"/></svg>`;
}

let AC = null;

    AC = AC || new (window.AudioContext || window.webkitAudioContext)();

      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * gap;
      o.type = type; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + dur + .25);
      o.start(t); o.stop(t + dur + .3);
    });
  } catch (e) {}
}
const sndOk = () => tone([1046.5, 1318.5], .12, 'sine', .12);
const sndNg = () => tone([392, 330], .14, 'triangle', .14, .12);
const sndFin = () => tone([784, 988, 1175, 1568], .14, 'sine', .1);
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
let VOICE = null;
const enVoices = () => { try { return speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); } catch (e) { return []; } };
function pickVoice() {
  const vs = enVoices(), v = settings.voice || 'auto-us';
  const want = v === 'auto-gb' ? /en[-_]GB/i : /en[-_]US/i;
  VOICE = vs.find(x => x.voiceURI === v) || vs.find(x => want.test(x.lang) && /Google/i.test(x.name)) || vs.find(x => want.test(x.lang)) || vs[0] || null;
}
const voiceLang = () => VOICE ? VOICE.lang : settings.voice === 'auto-gb' ? 'en-GB' : 'en-US';
try { speechSynthesis.onvoiceschanged = () => { pickVoice(); if (typeof fillVoices === 'function') fillVoices(); }; pickVoice(); } catch (e) {}
function say(text, slow, onend) {
  let fired = false; const end = () => { if (!fired) { fired = true; onend && onend(); } };
  try {
    if (!VOICE) pickVoice();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voiceLang(); if (VOICE) u.voice = VOICE;
    u.rate = slow ? 0.55 : settings.rate;
    u.onend = end; u.onerror = end;
    speechSynthesis.speak(u);
    if (onend) setTimeout(end, 1500 + text.length * 180); // 読み上げが止まっても先へ進めるように

}
/* 音声認識（Pixel の Chrome なら Google の音声認識が使える） */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function listenEn(onDone) {
  if (!SR) return null;
  try {
    const r = new SR(); r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    let got = false;
    r.onresult = e => { got = true; onDone({ alts: [...e.results[0]].map(a => a.transcript.toLowerCase().trim()) }); };
    r.onerror = e => { got = true; onDone({ error: e.error || 'error' }); };
    r.onend = () => { if (!got) onDone({ alts: [] }); };
    speechSynthesis.cancel(); r.start(); return r;
  } catch (e) { onDone({ error: 'start' }); return null; }
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function heardOk(alts, target) {
  const t = target.toLowerCase().replace(/[^a-z' ]/g, '').trim();
  return alts.some(a => { const w = a.replace(/[^a-z' ]/g, ' ').split(/\s+/).filter(Boolean); return a.replace(/[^a-z' ]/g, '').trim() === t || w.includes(t) || (t.length >= 4 && w.some(x => lev(x, t) <= 1)); });
}

/* ---------- 問題ジェネレータ ----------
   セットのJSONで {"generate":{"skill":"add_carry1","count":10}} と書くと自動で作られる */
const M = '−', X = '×', D = '÷';
const num = (prompt, ans, extra = {}) => Object.assign({ type: 'number', subject: 'math', prompt, big: true, answer: [].concat(ans) }, extra);

const GEN = {
  make10() {
    const a = rnd(1, 9);
    return num(`${a} と □ で 10`, 10 - a, { big: false, key: `m10:${a}`, visual: { kind: 'frame', a }, hintShow: true,
      explain: [`{空|あ}いている○を{数|かぞ}える`, `${a} + ${10 - a} = 10`] });
  },
  add_small() {
    const a = rnd(1, 9), b = rnd(1, 10 - a);
    return num(`${a} + ${b} =`, a + b, { key: `as:${a}+${b}`, visual: { kind: 'dots', a, b }, explain: [`${a} から ${b} つ{進|すす}む`, `${a} + ${b} = ${a + b}`] });
  },
  add_carry1() {
    let a, b; do { a = rnd(2, 9); b = rnd(2, 9); } while (a + b <= 10);
    const need = 10 - a, rest = b - need;
    return num(`${a} + ${b} =`, a + b, { key: `ac:${a}+${b}`, visual: { kind: 'dots', a, b },
      explain: [`${b} を ${need} と ${rest} に{分|わ}ける`, `${a} + ${need} = 10（10のまとまり）`, `10 + ${rest} = ${a + b}`] });
  },
  sub_small() {
    const a = rnd(2, 10), b = rnd(1, a - 1);
    return num(`${a} ${M} ${b} =`, a - b, { key: `ss:${a}-${b}`, visual: { kind: 'sub', a, b }, explain: [`${a} {個|こ}から ${b} {個|こ}{取|と}る`, `{残|のこ}りは ${a - b}`] });
  },
  sub_borrow() {
    let a, b; do { a = rnd(11, 18); b = rnd(2, 9); } while (a - 10 >= b);
    return num(`${a} ${M} ${b} =`, a - b, { key: `sb:${a}-${b}`, visual: { kind: 'sub', a, b },
      explain: [`${a} を 10 と ${a - 10} に{分|わ}ける`, `10 ${M} ${b} = ${10 - b}`, `${10 - b} + ${a - 10} = ${a - b}`] });
  },
  mix1() { return pick([GEN.add_small, GEN.add_carry1, GEN.sub_small, GEN.sub_borrow])(); },
  add2(p = {}) {
    let a, b, c; do { a = rnd(10, 79); b = rnd(10, 99 - a); c = (a % 10) + (b % 10) >= 10; } while (p.carry === false && c || p.carry === true && !c);
    const o = a % 10 + b % 10, t = Math.floor(a / 10) + Math.floor(b / 10) + (o >= 10 ? 1 : 0);
    return num(`${a} + ${b} =`, a + b, { key: `a2:${a}+${b}`,
      explain: [`{一|いち}の{位|くらい}: ${a % 10} + ${b % 10} = ${o}` + (o >= 10 ? '（10を{繰|く}り{上|あ}げる）' : ''), `{十|じゅう}の{位|くらい}: ${Math.floor(a / 10)} + ${Math.floor(b / 10)}` + (o >= 10 ? ' + 1' : '') + ` = ${t}`, `{答|こた}え ${a + b}`] });
  },
  sub2(p = {}) {
    let a, b, c; do { a = rnd(20, 99); b = rnd(10, a - 1); c = a % 10 < b % 10; } while (p.borrow === false && c || p.borrow === true && !c);
    const bor = a % 10 < b % 10, o = (bor ? 10 : 0) + a % 10 - b % 10, t = Math.floor(a / 10) - (bor ? 1 : 0) - Math.floor(b / 10);
    return num(`${a} ${M} ${b} =`, a - b, { key: `s2:${a}-${b}`,
      explain: [bor ? `{一|いち}の{位|くらい}: ${a % 10} から ${b % 10} は{引|ひ}けない → {十|じゅう}の{位|くらい}から10{借|か}りる → ${10 + a % 10} ${M} ${b % 10} = ${o}` : `{一|いち}の{位|くらい}: ${a % 10} ${M} ${b % 10} = ${o}`,
        `{十|じゅう}の{位|くらい}: ${Math.floor(a / 10)}` + (bor ? ` ${M} 1` : '') + ` ${M} ${Math.floor(b / 10)} = ${t}`, `{答|こた}え ${a - b}`] });
  },
  kuku(p = {}) {
    const d = p.dan && p.dan !== 'mix' ? +p.dan : rnd(2, 9), n = rnd(1, 9);
    const seq = Array.from({ length: n }, (_, i) => d * (i + 1)).join(', ');
    return num(`${d} ${X} ${n} =`, d * n, { key: `k:${d}x${n}`, visual: { kind: 'array', r: n, c: d },
      explain: [`${d} を ${n} {回|かい}{足|た}す`, `${seq}`, `${d} ${X} ${n} = ${d * n}`] });
  },
  div_kuku() {
    const d = rnd(2, 9), q = rnd(1, 9);
    return num(`${d * q} ${D} ${d} =`, q, { key: `dk:${d * q}/${d}`,
      explain: [`${d} ${X} □ = ${d * q} の □ を{探|さが}す（${d}の{段|だん}）`, `${d} ${X} ${q} = ${d * q}`, `{答|こた}え ${q}`] });
  },
  div_rem() {
    const d = rnd(2, 9), q = rnd(1, 9), r = rnd(1, d - 1), n = d * q + r;
    return num(`${n} ${D} ${d} =`, [q, r], { key: `dr:${n}/${d}`, fields: [{}, { pre: '{余|あま}り' }],
      explain: [`${d}の{段|だん}で ${n} を{超|こ}えない{一番|いちばん}{大|おお}きい{数|かず}`, `${d} ${X} ${q} = ${d * q}`, `${n} ${M} ${d * q} = ${r} → {余|あま}り ${r}`] });
  },
  mul21() {
    const a = rnd(11, 49), b = rnd(2, 9), t = Math.floor(a / 10) * 10, o = a % 10;
    return num(`${a} ${X} ${b} =`, a * b, { key: `m21:${a}x${b}`,
      explain: [`${a} を ${t} と ${o} に{分|わ}ける`, `${t} ${X} ${b} = ${t * b}`, `${o} ${X} ${b} = ${o * b}`, `${t * b} + ${o * b} = ${a * b}`] });
  },
  place() {
    const n = rnd(1000, 9999), s = String(n), names = ['千', '百', '十', '一'], yomi = ['せん', 'ひゃく', 'じゅう', 'いち'], i = rnd(0, 3);
    return num(`${n} の{${names[i]}|${yomi[i]}}の{位|くらい}の{数字|すうじ}は？`, +s[i], { big: false, key: `pl:${n}:${i}`,
      explain: [s.split('').map((c, j) => `${names[j]}:${c}`).join('　'), `{${names[i]}|${yomi[i]}}の{位|くらい}は ${s[i]}`] });
  },

  /* ---- 英語：フォニックス ---- */
  ph_initial() {
    const w = pick(PH.cvc.flatMap(g => g.words)), c = w[0];
    const others = shuffle('bcdfghjklmnprstvwz'.split('').filter(x => x !== c)).slice(0, 3);
    return { type: 'choice', subject: 'english', key: `pi:${w}`, prompt: `{聞|き}いて、{最初|さいしょ}の{音|おと}を{選|えら}ぼう`, speak: w, autoSpeak: true,
      options: shuffle([c, ...others]), answer: c, two: true, reveal: w, explain: [`${w} は ${c} の{音|おと}で{始|はじ}まる`] };
  },
  ph_vowel() {
    const g = pick(PH.cvc), w = pick(g.words);
    return { type: 'choice', subject: 'english', key: `pv:${w}`, prompt: `{聞|き}いて、{真|ま}ん{中|なか}の{音|おと}を{選|えら}ぼう\n${w[0]} _ ${w[2]}`, speak: w, autoSpeak: true,
      options: ['a', 'e', 'i', 'o', 'u'], fixed: true, answer: g.v, reveal: w, explain: [`${w} の{真|ま}ん{中|なか}は ${g.v}`, `${g.v} の{音|おと}: ${g.tip}`] };
  },
  ph_word() {
    const set = pick(PH.pairs), w = pick(set);
    return { type: 'choice', subject: 'english', key: `pw:${w}`, prompt: `{聞|き}こえた{単語|たんご}はどれ？`, speak: w, autoSpeak: true,
      options: shuffle(set), answer: w, explain: [`{正解|せいかい}は ${w}`, `ほかの{単語|たんご}も{聞|き}き{比|くら}べてみよう`], speakOptions: true };
  },
  ph_digraph() {
    const g = pick(PH.digraph), w = pick(g.words), blank = w.replace(g.d, '__');
    return { type: 'choice', subject: 'english', key: `pd:${w}`, prompt: `{聞|き}いて、□に{入|はい}る2{文字|もじ}は？\n${blank}`, speak: w, autoSpeak: true,
      options: shuffle(PH.digraph.map(x => x.d)), answer: g.d, two: true, reveal: w, explain: [`${w} → ${g.d}`, `${g.d}: ${g.tip}`] };
  },
  ph_magic() {
    const pr = pick(PH.magic), i = rnd(0, 1), w = pr[i];
    return { type: 'choice', subject: 'english', key: `pm:${w}`, prompt: `{聞|き}こえたのはどっち？`, speak: w, autoSpeak: true,
      options: shuffle(pr), answer: w, two: true, speakOptions: true,
      explain: [`${pr[0]} → ${pr[1]}`, `{終|お}わりの e は{読|よ}まない。{前|まえ}の{母音|ぼいん}がアルファベットの{名前|なまえ}{読|よ}みになる（a→エイ、i→アイ、o→オウ、u→ユー）`] };
  },
  ph_symbol() {
    const s = pick(PH.symbol), w = pick(s.words);
    const others = shuffle(PH.symbol.filter(x => x.sym !== s.sym && !x.words.some(y => s.words.includes(y)))).slice(0, 2).map(x => pick(x.words));
    return { type: 'choice', subject: 'english', key: `ps:${s.sym}:${w}`, prompt: `/${s.sym}/ の{音|おと}が{入|はい}っているのは？\n${s.tip}`,
      options: shuffle([w, ...others]), answer: w, speakOptions: true, explain: [`/${s.sym}/ → ${s.words.join(', ')}`, s.tip] };
  },
};

/* まとめて作るタイプ（説明カード＋問題） */
const GENSET = {
  /* つづりと音：説明カード → 穴うめ → 言ってみよう */
  ph_pattern(p = {}, count = 4) {
    const pt = PH.patterns[p.pattern] || pick(Object.values(PH.patterns));
    const words = shuffle(pt.words).slice(0, Math.min(count, pt.words.length));
    const out = [{ type: 'learn', subject: 'english', practice: true, key: `pl:${pt.p}`, pattern: pt.p, sym: pt.sym, tip: pt.tip, words }];
    words.forEach(w => {
      const dist = shuffle(pt.dist).slice(0, 2);
      out.push({ type: 'choice', subject: 'english', key: `pf:${w.w}`, prompt: `{聞|き}いて、{入|はい}る{文字|もじ}を{選|えら}ぼう`, blank: { word: w.w.replace(pt.p, '＿＿'), ja: w.ja },
        speak: w.w, autoSpeak: true, options: shuffle([pt.p, ...dist]), fixed: false, two: false, answer: pt.p, reveal: `${w.w}　/${w.ipa}/`,
        explain: [`${w.w}（${w.ja}） /${w.ipa}/`, `${pt.p} は /${pt.sym}/ の{音|おと}`] });
    });
    if (p.say !== false) shuffle(words).slice(0, 2).forEach(w => out.push(sayQ(w, pt)));
    return out;
  },
  /* 言ってみよう（発音チェック） */
  ph_say(p = {}, count = 6) {
    const all = Object.values(PH.patterns).flatMap(pt => pt.words.map(w => [w, pt]));
    return shuffle(all).slice(0, count).map(([w, pt]) => sayQ(w, pt));
  },
};

/* count問つくる（同じ問題がなるべく続かないように） */
function generate(skill, count = 10, params = {}) {
  if (GENSET[skill]) return GENSET[skill](params, count).map(q => Object.assign(q, { id: 'g:' + q.key, skill }));
  const f = GEN[skill]; if (!f) return [];
  const out = [], seen = new Set();
  for (let tries = 0; out.length < count && tries < count * 30; tries++) {
    const q = f(params);
    if (seen.has(q.key) && tries < count * 20) continue;
    seen.add(q.key); q.id = 'g:' + q.key; q.skill = skill; out.push(q);
  }
  return out;
}

/* ---------- 出題エンジン ---------- */
const SUBJ = { math: '{数学|すうがく}', english: '{英語|えいご}', japanese: '{国語|こくご}', review: '{復習|ふくしゅう}', other: 'その{他|ほか}' };
const PRAISE = ['{正解|せいかい}！', 'いいね！', 'その{調子|ちょうし}！', 'すごい！', 'ばっちり！', '{完璧|かんぺき}！'];
const CHEER = ['{惜|お}しい！', '{大丈夫|だいじょうぶ}！', '{一緒|いっしょ}に{確|たし}かめよう'];
const PRACTICE = new Set(['learn', 'break', 'say', 'write']);
let Q = null; // いまのクイズ

/* 誤タップ防止：画面やボタンが切り替わってから 0.28秒 は押しても反応しない */
const TAP_GUARD = 280;
let tapLockUntil = 0;
const lockTaps = () => { tapLockUntil = Date.now() + TAP_GUARD; document.body.classList.add('taplock'); clearTimeout(lockTaps.t); lockTaps.t = setTimeout(() => document.body.classList.remove('taplock'), TAP_GUARD); };
['#scr-quiz', '#sheet'].forEach(sel => document.querySelector(sel).addEventListener('click', e => {
  if (Date.now() < tapLockUntil && e.target.closest('button') && !e.target.closest('#qclose')) { e.stopPropagation(); e.preventDefault(); }
}, true));

function normQ(q, i, prefix) {
  q = Object.assign({}, q);
  if (q.answer != null && q.type === 'number') q.answer = [].concat(q.answer).map(Number);
  if (!q.type) q.type = q.options ? 'choice' : 'self';
  if (!q.id) q.id = prefix + ':' + i;
  if (PRACTICE.has(q.type)) q.practice = true;
  return q;
}
function buildSet(set) {
  const list = [];
  (set.sections || []).forEach((sec, si) => {
    let qs = [];
    if (sec.generate) qs = qs.concat(generate(sec.generate.skill, sec.generate.count || 10, sec.generate));
    (sec.questions || []).forEach((q, qi) => qs.push(normQ(Object.assign({ subject: sec.subject }, q), `${si}-${qi}`, set.id)));
    if (sec.shuffle) qs = shuffle(qs);
    qs.forEach(q => { q.subject = q.subject || sec.subject || 'other'; });
    // 教科が変わるところで ひと休み
    const prev = list.filter(q => q.type !== 'break').slice(-1)[0];
    if (prev && qs[0] && prev.subject !== qs[0].subject) list.push({ type: 'break', practice: true, id: `${set.id}:br${si}`, from: prev.subject, to: qs[0].subject });
    list.push(...qs);
  });
  return list;
}

function startQuiz({ title, list, setId = null, mode = 'set', subject = 'mix' }) {
  if (!list.length) { toast('{問題|もんだい}がありません'); return; }
  Q = { title, list, setId, mode, subject, queue: list.map((_, i) => i), res: list.map(() => ({ first: null, tries: 0, done: false })), cur: -1, start: Date.now(), locked: false };
  show('quiz'); nextQ();
}

function nextQ() {
  hideSheet(); lockTaps();
  if (!Q.queue.length) return finishQuiz();
  Q.cur = Q.queue.shift(); Q.locked = false;
  const q = Q.list[Q.cur], r = Q.res[Q.cur];
  const pct = Math.round(Q.res.filter(x => x.done).length / Q.list.length * 100);
  const subj = Q.mode === 'review' ? 'review' : q.subject;
  const head = `<div class="qtop"><button class="iconbtn" id="qclose" aria-label="やめる">${ICON.close}</button><div class="pbar"><i style="width:${pct}%"></i></div></div>`;
  if (q.type === 'break') return renderBreak(q, head);
  if (q.type === 'learn') return renderLearn(q, head);
  if (q.type === 'say') return renderSay(q, head);
  if (q.type === 'write') return renderWrite(q, head);
  $('#scr-quiz').innerHTML = `${head}
    <div class="qcard" id="qcard">
      <span class="qsub ${subj}">${fmt((SUBJ[subj] || SUBJ.other) + (r.tries ? '・もう{一度|いちど}' : ''))}</span>
      ${q.image ? `<img src="${esc(q.image)}" alt="" style="max-height:180px;border-radius:12px">` : ''}
      ${q.stage ? `<div class="stage"><div class="togaki">〈${fmt(q.stage.t)}〉</div><div class="serifu">「${fmt(q.stage.l)}」</div></div>` : ''}
      <div class="prompt ${q.big ? 'big' : ''}">${fmt(q.prompt)}</div>
      ${q.blank ? `<div class="blankword en">${esc(q.blank.word)}</div><div class="blankja">（${fmt(q.blank.ja)}）</div>` : ''}
      ${q.speak ? speakBtns() : ''}
      ${q.visual ? (q.hintShow ? `<div class="visual">${visual(q.visual)}</div>` : `<button class="hintbtn" id="hint"></button><div class="visual" id="vis" hidden>${visual(q.visual)}</div>`) : ''}
      ${!q.visual && q.hint ? `<button class="hintbtn" id="hint"></button><div class="muted" id="vis" hidden>${fmt(q.hint)}</div>` : ''}
    </div>
    <div class="answer" id="ans"></div>`;
  if ($('#hint')) { $('#hint').innerHTML = fmt('ヒントを{見|み}る'); $('#hint').onclick = () => { $('#vis').hidden = false; $('#hint').remove(); }; }
  $('#qclose').onclick = confirmQuit;
  bindSpeak(q);
  ({ number: ansNumber, choice: ansChoice, order: ansOrder, text: ansText, self: ansSelf }[q.type] || ansSelf)(q);
}
const speakBtns = () => `<div class="speakrow"><button class="speak" id="say">${ICON.speaker}${fmt('{聞|き}く')}</button><button class="speak slow" id="sayslow">ゆっくり</button></div>`;
function bindSpeak(q) {
  if (!q.speak || !$('#say')) return;
  $('#say').onclick = () => say(q.speak); $('#sayslow').onclick = () => say(q.speak, true);
  if (q.autoSpeak) setTimeout(() => say(q.speak), 350);
}

let quitArm = 0;
function confirmQuit() {
  if (Date.now() - quitArm < 2500) { Q = null; hideSheet(); renderHome(); show('home'); return; }
  quitArm = Date.now(); toast('もう{一回|いっかい} × を{押|お}すとやめます');
}

/* --- ひと休み（教科の切り替わり） --- */
function renderBreak(q, head) {
  $('#scr-quiz').innerHTML = `${head}<div class="qcard calm"><div class="restart">${ART.rest}</div>
    <div class="prompt">${fmt(`${SUBJ[q.from] || ''}おしまい！`)}</div>
    <p class="muted">${fmt('{少|すこ}し{休|やす}んでから{次|つぎ}へ')}</p></div>
    <div class="answer"><button class="bigbtn" id="go">${fmt(`${SUBJ[q.to] || ''}へ`)}</button></div>`;
  $('#qclose').onclick = confirmQuit;
  $('#go').onclick = () => { Q.res[Q.cur].done = true; nextQ(); };
}

/* --- 言ってみよう（音声認識） --- */
function renderSay(q, head) {
  const r = Q.res[Q.cur]; let tries = 0, rec = null;
  $('#scr-quiz').innerHTML = `${head}<div class="qcard" id="qcard">
    <span class="qsub english">${fmt('{言|い}ってみよう')}</span>
    <div class="chunk en" style="font-size:clamp(40px,12vw,58px)">${hl(q.word, q.pattern)}</div>
    <div class="ipa">/${esc(q.ipa)}/</div><div class="blankja">${fmt(q.ja)}</div>
    ${speakBtns()}</div>
    <div class="answer"><button class="micbtn" id="mic">${ART.mic}<span>${fmt(SR ? '{押|お}して{言|い}う' : '{声|こえ}に{出|だ}して{言|い}ってみよう')}</span></button>
      <p class="muted center" id="heard"></p>
      <button class="bigbtn ghost" id="skip">${fmt(SR ? '{次|つぎ}へ' : '{言|い}えた！{次|つぎ}へ')}</button></div>`;
  $('#qclose').onclick = () => { try { rec && rec.abort(); } catch (e) {} confirmQuit(); };
  bindSpeak({ speak: q.speak, autoSpeak: true });
  const done = ok => { if (Q.locked) return; Q.locked = true; r.done = true; if (r.first === null) r.first = !!ok; };
  $('#skip').onclick = () => { done(!SR); nextQ(); };
  if (!SR) { $('#mic').disabled = true; return; }
  $('#mic').onclick = () => {
    if (Q.locked || rec) return;
    $('#mic').classList.add('rec'); $('#heard').innerHTML = fmt('{聞|き}いているよ…');
    rec = listenEn(res => {
      rec = null; $('#mic').classList.remove('rec');
      if (res.error) { $('#heard').innerHTML = fmt(res.error === 'not-allowed' ? 'マイクが{使|つか}えません（{設定|せってい}で{許可|きょか}してね）' : 'うまく{聞|き}き{取|と}れなかった。もう{一回|いっかい}'); return; }
      tries++;
      if (heardOk(res.alts, q.word)) {
        done(tries === 1); sndOk(); buzz(30);
        $('#qcard').insertAdjacentHTML('beforeend', hanamaruSVG());
        openFeedback('good', `<h3>${fmt('{伝|つた}わったよ！')}</h3><button class="bigbtn" id="nx">${fmt('{次|つぎ}へ')}</button>`);
        $('#nx').onclick = () => { if (Q) nextQ(); };
      } else {
        const h = res.alts[0];
        $('#heard').innerHTML = fmt(h ? `「${h}」に{聞|き}こえたよ。{聞|き}いてから、もう{一回|いっかい}` : 'もう{少|すこ}し{大|おお}きな{声|こえ}で、もう{一回|いっかい}');
        if (tries >= 3) { $('#skip').innerHTML = fmt('{今日|きょう}はここまで。{次|つぎ}へ'); }
      }
    });
  };
}

/* --- 図のヒント --- */
function visual(v) {
  const frame = (fillA, fillB, cross = 0) => `<div class="frame">${Array.from({ length: 10 }, (_, i) => `<i class="${i < fillA ? 'a' : i < fillA + fillB ? 'b' : ''}${cross && i >= fillA - cross && i < fillA ? ' x' : ''}"></i>`).join('')}</div>`;
  if (v.kind === 'frame') return `<div class="frames">${frame(v.a, 0)}</div><div class="vcap">${fmt(`●が ${v.a}{個|こ}。{空|あ}いている○は？`)}</div>`;
  if (v.kind === 'dots') {
    const a = v.a, b = v.b, f1b = Math.min(b, 10 - a), f2b = b - f1b;
    return `<div class="frames">${frame(a, f1b)}${a + b > 10 ? frame(0, f2b) : ''}</div><div class="vcap">${a} と ${b}${a + b > 10 ? `　→ 10 と ${a + b - 10}` : ''}</div>`;
  }
  if (v.kind === 'sub') {
    const a = v.a, b = v.b;
    if (a <= 10) return `<div class="frames">${frame(a, 0, b)}</div><div class="vcap">${fmt(`${a}{個|こ}から ${b}{個|こ}{取|と}る`)}</div>`;
    return `<div class="frames">${frame(10, 0, b)}${frame(a - 10, 0)}</div><div class="vcap">${fmt(`10のまとまりから ${b} {取|と}る`)}</div>`;
  }
  if (v.kind === 'array') return `<div class="arr" style="grid-template-columns:repeat(${v.c},14px)">${'<i></i>'.repeat(v.r * v.c)}</div><div class="vcap">${fmt(`${v.c}{個|こ}ずつ ${v.r}{列|れつ}`)}</div>`;
  return '';
}

/* --- 数字入力（大きいテンキー） --- */
function ansNumber(q) {
  const fields = q.fields || q.answer.map(() => ({}));
  const vals = fields.map(() => ''); let act = 0;
  const box = () => `<div class="boxes">${fields.map((f, i) => `${f.pre ? `<span>${fmt(f.pre)}</span>` : ''}<div class="box ${i === act ? 'active' : ''} ${vals[i] === '' ? 'empty' : ''}" data-i="${i}">${vals[i]}</div>${f.post ? `<span>${fmt(f.post)}</span>` : ''}`).join('')}</div>`;
  const render = () => {
    $('#ans').innerHTML = box() + `<div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join('')}<button class="del" data-n="del">${fmt('{消|け}す')}</button><button data-n="0">0</button><button class="go" data-n="go">${fmt('{答|こた}える')}</button></div>`;
    $$('#ans .box').forEach(b => b.onclick = () => { act = +b.dataset.i; render(); });
    $$('#ans .pad button').forEach(b => b.onclick = () => {
      if (Q.locked) return;
      const n = b.dataset.n;
      if (n === 'del') vals[act] = vals[act].slice(0, -1);
      else if (n === 'go') {
        const empty = vals.findIndex(v => v === '');
        if (empty >= 0) { act = empty; render(); return; }
        return judge(vals.every((v, i) => +v === q.answer[i]), q.answer.join(' / '));
      } else if (vals[act].length < 5) { vals[act] = (vals[act] === '0' ? '' : vals[act]) + n; }
      render();
    });
  };
  render();
}
/* --- 選ぶ --- */
function ansChoice(q) {
  const opts = q.fixed ? q.options : shuffle(q.options);
  const two = q.two || (opts.length % 2 === 0 && opts.every(o => bare(o).length <= 6) && !q.speakOptions);
  $('#ans').innerHTML = `<div class="opts ${two ? 'two' : ''}">${opts.map((o, i) => q.speakOptions
    ? `<div class="optrow"><button class="say" data-say="${esc(bare(o))}" aria-label="聞く">${ICON.speaker}</button><button class="opt" data-i="${i}">${fmt(o)}</button></div>`
    : `<button class="opt${bare(o).length > 9 ? ' long' : ''}" data-i="${i}">${fmt(o)}</button>`).join('')}</div>`;
  $$('#ans .say').forEach(b => b.onclick = () => say(b.dataset.say));
  $$('#ans .opt').forEach(b => b.onclick = () => {
    if (Q.locked) return;
    const ok = opts[+b.dataset.i] === q.answer;
    b.classList.add(ok ? 'right' : 'wrong');
    if (!ok) $$('#ans .opt').forEach(x => { if (opts[+x.dataset.i] === q.answer) x.classList.add('right'); });
    if (q.blank) { const bw = $('#scr-quiz .blankword'); if (bw) bw.innerHTML = hl(q.speak, q.answer); }
    judge(ok, q.answer);
  });
}
/* --- 並べ替え --- */
function ansOrder(q) {
  const words = q.words || String(q.answer).split(/\s+/);
  const pool = shuffle(words.concat(q.extra || []).map((w, i) => ({ w, i })));
  const line = [];
  const render = () => {
    $('#ans').innerHTML = `<div class="line">${line.map((p, k) => `<button class="word" data-k="${k}">${esc(p.w)}</button>`).join('')}</div>
      <div class="pool">${pool.map(p => `<button class="word ${line.includes(p) ? 'used' : ''}" data-i="${p.i}">${esc(p.w)}</button>`).join('')}</div>
      <button class="bigbtn" id="go" ${line.length ? '' : 'disabled'}>${fmt('{答|こた}える')}</button>`;
    $$('#ans .line .word').forEach(b => b.onclick = () => { if (Q.locked) return; line.splice(+b.dataset.k, 1); render(); });
    $$('#ans .pool .word').forEach(b => b.onclick = () => { if (Q.locked) return; const p = pool.find(x => x.i === +b.dataset.i); if (!line.includes(p)) { line.push(p); if (q.speakWords) say(p.w); } render(); });
    $('#go').onclick = () => { if (Q.locked) return; judge(normEn(line.map(p => p.w).join(' ')) === normEn(words.join(' ')), words.join(' ')); };
  };
  render();
}
const normEn = s => String(s).toLowerCase().replace(/[’`]/g, "'").replace(/[.,!?。、]/g, ' ').replace(/\s+/g, ' ').trim();
/* --- 書く（つづり） --- */

/* --- 判定 --- */
function judge(ok, correct, selfMode) {
  if (Q.locked) return; Q.locked = true;
  const q = Q.list[Q.cur], r = Q.res[Q.cur];
  r.tries++;
  if (ok) {
    if (r.first === null) r.first = true;
    r.done = true;
    if (r.first) promoteMistake(q);
    sndOk(); buzz(30);
    $('#qcard').insertAdjacentHTML('beforeend', hanamaruSVG());
    const more = q.reveal ? `<div class="correct en">${fmt(q.reveal)}</div>` : '';
    // 英語は正しい文・単語を読み上げる。自動送りは読み終わってから
    const sp = selfMode ? null : speechFor(q), cur = Q.cur;
    const again = sp ? `<button class="speak" id="again">${ICON.speaker}<span class="en">${esc(sp)}</span></button>` : '';
    openFeedback('good', `<h3>${fmt(pick(PRAISE))}</h3>${q.reveal && bare(q.reveal) !== sp ? more : ''}${again}<button class="bigbtn" id="nx">${fmt('{次|つぎ}へ')}</button>`);
    $('#nx').onclick = () => { if (Q && Q.locked) nextQ(); };
    if ($('#again')) $('#again').onclick = () => { clearTimeout(Q.autoT); say(sp); };
    const go = () => { if (settings.autoNext && !selfMode && Q && Q.locked && Q.cur === cur) nextQ(); };
    if (sp) setTimeout(() => say(sp, false, () => { Q && (Q.autoT = setTimeout(go, 700)); }), 250);
    else if (settings.autoNext && !selfMode) Q.autoT = setTimeout(go, q.reveal ? 2300 : 1100);
  } else {
    if (r.first === null) r.first = false;
    addMistake(q);
    sndNg(); buzz([20, 60, 20]);
    $('#qcard').classList.remove('shake'); void $('#qcard').offsetWidth; $('#qcard').classList.add('shake');
    if (r.tries < 3) Q.queue.push(Q.cur); else r.done = true;
    const exp = q.explain ? `<ol class="steps">${[].concat(q.explain).map(s => `<li>${fmt(s)}</li>`).join('')}</ol>` : '';
    openFeedback('bad', `<h3>${fmt(pick(CHEER))}</h3>${selfMode ? '' : `<div class="correct">${fmt('{答|こた}え')}<b>${fmt(Array.isArray(correct) ? correct.join(' / ') : correct)}</b></div>`}${exp}
      <div class="muted">${fmt(r.tries < 3 ? 'この{問題|もんだい}は{後|あと}でもう{一度|いちど}{出|で}るよ' : '{次|つぎ}の{復習|ふくしゅう}でまた{出|で}るよ')}</div>
      <button class="bigbtn" id="nx">${fmt('{分|わ}かった')}</button>`);
    $('#nx').onclick = () => { if (Q && Q.locked) nextQ(); };
    const sp = speechFor(q); if (sp) setTimeout(() => say(sp), 400);
  }
}
/* 答えた後の表示：画面の下（シート）か、最後に押した場所の近く（大きいボタン） */
function openSheet(kind, html) { const s = $('#sheet'); s.className = 'sheet show ' + kind; $('#sheetin').innerHTML = html; }
function openFeedback(kind, html) {
  lockTaps();
  const ans = $('#ans');
  if (settings.nextPos !== 'near' || !ans) return openSheet(kind, html);
  const fb = document.createElement('div'); fb.className = 'inlinefb ' + kind; fb.innerHTML = html;
  const spot = ans.querySelector('.pad, #go, .selfbtns, #mic');
  if (spot) spot.replaceWith(fb); else ans.appendChild(fb);
  const sk = ans.querySelector('#skip'); if (sk) sk.remove();
  requestAnimationFrame(() => { const r = fb.getBoundingClientRect(); if (r.bottom > innerHeight - 8) fb.scrollIntoView({ behavior: 'smooth', block: 'end' }); });
}
function hideSheet() { clearTimeout(Q && Q.autoT); $('#sheet').className = 'sheet'; $('#sheetin').innerHTML = ''; }
/* 答えのあとに読み上げる英語（並べ替えの文、___ を埋めた文、単語など） */
const isEn = t => /^[A-Za-z][A-Za-z' .,!?\-]*$/.test(String(t).trim());
function speechFor(q) {
  if (q.subject !== 'english' || q.sayAfter === false) return null;
  if (typeof q.sayAfter === 'string') return q.sayAfter;
  if (q.type === 'order') return (q.words || String(q.answer).split(/\s+/)).join(' ');
  const line = bare(q.prompt || '').split('\n').find(l => /_{2,}/.test(l) && /[A-Za-z]/.test(l));
  if (line && typeof q.answer === 'string') return line.replace(/_{2,}/, q.answer);
  if (q.speak) return q.speak;
  const a = [].concat(q.answer)[0];
  return a != null && isEn(bare(a)) ? bare(a) : null;
}

/* --- 間違い帳（間隔をあけて復習） --- */
const GAPS = [1, 3, 7];
function addMistake(q) {
  if (q.practice) return;
  const m = store.get('mistakes', {});
  const cur = m[q.id];
  m[q.id] = { q: Object.assign({}, q), box: 0, due: addDays(today(), 1), n: (cur ? cur.n : 0) + 1, at: today() };
  store.set('mistakes', m);
}
function promoteMistake(q) {
  const m = store.get('mistakes', {}); const e = m[q.id]; if (!e || e.at === today()) return;
  e.box++; if (e.box >= GAPS.length) delete m[q.id]; else e.due = addDays(today(), GAPS[e.box]);
  store.set('mistakes', m);
}
function dueMistakes() {
  const m = store.get('mistakes', {}), t = today();
  return Object.values(m).filter(e => e.due <= t).sort((a, b) => a.due < b.due ? -1 : 1);
}

/* ---------- データ ---------- */
let CFG = { childName: '', reportUrl: '', reportKey: '' };
let SETS = []; // {id,date,title,...set}

async function getJSON(path) {
  const r = await fetch(path + (path.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status); return r.json();
}
async function loadData() {
  try {
    const [cfg, idx] = await Promise.all([getJSON('data/config.json').catch(() => ({})), getJSON('data/index.json')]);
    CFG = Object.assign(CFG, cfg);
    const files = (idx.sets || []).slice(0, 60);
    const sets = await Promise.all(files.map(f => getJSON('data/sets/' + f).catch(() => null)));
    SETS = sets.filter(Boolean);
  } catch (e) {
    if (window.EMBED) { CFG = Object.assign(CFG, EMBED.config); SETS = EMBED.sets.slice(); }
  }
  SETS.sort((a, b) => (a.date < b.date ? 1 : -1));
}
const childName = () => settings.name || CFG.childName || '';

/* ---------- きろく ---------- */
const getLog = () => store.get('log', []);
const getDone = () => store.get('done', {});
function streak() {
  const days = new Set(getLog().map(l => l.d)); let n = 0, d = today();
  if (!days.has(d)) d = addDays(d, -1);
  while (days.has(d)) { n++; d = addDays(d, -1); }
  return n;
}

function setMeta(s) {
  const secs = (s.sections || []).map(sec => ({ subject: sec.subject, n: (sec.generate ? sec.generate.count || 10 : 0) + (sec.questions || []).length }));
  return { secs, n: secs.reduce((a, b) => a + b.n, 0), subjects: [...new Set(secs.map(x => x.subject))] };
}
function todayCard(s, finished) {
  const { n, subjects } = setMeta(s);
  const icons = subjects.map(x => `<span class="subicon ${x}">${{ math: ART.pencil, english: ART.notes, japanese: ART.bubble }[x] || ''}${fmt(SUBJ[x] || '')}</span>`).join('');
  return `<div class="today">
    ${finished ? hanamaruSVG('done-mark') : ''}
    <div class="label">${fmt(s.date === today() ? '{今日|きょう}のプリント' : jdate(s.date) + ' のプリント')}</div>
    <h2>${fmt(s.title || 'プリント')}</h2>
    <div class="subicons">${icons}${settings.showTime ? `<span class="chip">${fmt(`{約|やく} ${Math.max(3, Math.round(n * 0.4))} {分|ふん}`)}</span>` : ''}</div>
    ${s.message && !finished ? `<div class="msg">${fmt(s.message)}</div>` : ''}
    ${finished ? `<p class="muted">${fmt('{今日|きょう}の{分|ぶん}はおしまい！')}</p><button class="bigbtn ghost" data-id="${esc(s.id)}">${fmt('もう{一回|いっかい}やる')}</button>`
      : `<button class="bigbtn red" data-id="${esc(s.id)}">${fmt('{始|はじ}める')}</button>`}
  </div>`;
}
function startSet(id) {
  const s = SETS.find(x => x.id === id); if (!s) return;
  startQuiz({ title: bare(s.title || 'プリント'), list: buildSet(s), setId: s.id, mode: 'set', subject: setMeta(s).subjects.join('+') });
}
function startReview() {
  let list = dueMistakes();
  if (!list.length) list = Object.values(store.get('mistakes', {}));
  if (!list.length) { toast('{復習|ふくしゅう}する{問題|もんだい}はまだないよ'); return; }
  startQuiz({ title: '復習', list: list.slice(0, 10).map(e => e.q), mode: 'review', subject: 'review' });
}

/* ---------- 練習メニュー（2段階：まとまり → 種類） ---------- */
function backBtn() { return `<button class="back" id="bk">${ICON.back}${fmt('{戻|もど}る')}</button>`; }
function renderDrill(subject, gi = null) {
  const groups = MENU[subject];
  if (gi === null) {
    $('#scr-drill').innerHTML = `${backBtn()}
      <div class="sectitle">${fmt({ math: '{計算|けいさん}{練習|れんしゅう}', english: '{英語|えいご}の{音|おと}', japanese: '{国語|こくご}の{言葉|ことば}' }[subject])}</div>
      <div class="list">${groups.map((g, i) => `<button class="grp ${subject}" data-g="${i}"><span class="art">${ART[g.art]}</span><b>${fmt(g.name)}</b></button>`).join('')}</div>`;
    $('#bk').onclick = () => { renderHome(); show('home'); };
    $$('#scr-drill .grp').forEach(b => b.onclick = () => renderDrill(subject, +b.dataset.g));
    return show('drill');
  }
  const g = groups[gi], count = subject === 'english' ? 8 : subject === 'japanese' ? 6 : 10;
  const pats = g.patterns ? Object.values(PH.patterns) : [];
  $('#scr-drill').innerHTML = `${backBtn()}
    <div class="sectitle">${fmt(g.name)}</div>
    <div class="skillgrid">${pats.map(pt => `<button class="skill english" data-pat="${pt.p}"><b class="en">${pt.p}</b><span class="ex">/${esc(pt.sym)}/</span></button>`).join('')}
      ${g.items.map(s => `<button class="skill ${subject}" data-id="${s.id}"><b>${fmt(s.name)}</b><span class="ex">${fmt(s.ex)}</span></button>`).join('')}</div>
    <div id="danbox" hidden><div class="sectitle">${fmt('{何|なん}の{段|だん}？')}</div><div class="danrow">${[2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button class="dan" data-d="${d}">${d}</button>`).join('')}<button class="dan" data-d="mix">まぜる</button></div></div>`;
  $('#bk').onclick = () => renderDrill(subject);
  $$('#scr-drill .skill[data-pat]').forEach(b => b.onclick = () => startQuiz({ title: `つづりと音 ${b.dataset.pat}`, list: generate('ph_pattern', 4, { pattern: b.dataset.pat }), mode: 'drill', subject }));
  $$('#scr-drill .skill[data-id]').forEach(b => b.onclick = () => {
    const s = g.items.find(x => x.id === b.dataset.id);
    if (s.dan) { $('#danbox').hidden = false; $('#danbox').scrollIntoView({ behavior: 'smooth' }); return; }
    startQuiz({ title: bare(s.name), list: generate(s.id, s.id === 'ph_say' ? 5 : s.id === 'ja_sakubun' ? 1 : count), mode: 'drill', subject });
  });
  $$('#scr-drill .dan').forEach(b => b.onclick = () => startQuiz({ title: `九九 ${b.dataset.d === 'mix' ? 'まぜる' : b.dataset.d + 'の段'}`, list: generate('kuku', 10, { dan: b.dataset.d }), mode: 'drill', subject: 'math' }));
  show('drill');
}

/* ---------- プリント一覧 ---------- */
function renderHistory() {
  const done = getDone(), t = today();
  $('#scr-history').innerHTML = `${backBtn()}
    <div class="sectitle">${fmt('プリント{一覧|いちらん}')}</div>
    <div class="list">${SETS.filter(s => s.date <= t).map(s => { const d = done[s.id]; return `<button class="row" data-id="${esc(s.id)}"><div class="t"><b>${fmt(s.title || 'プリント')}</b><small>${jdate(s.date)}</small></div><span class="badge">${d ? hanamaruSVG('mini') : ''}</span></button>`; }).join('') || `<p class="muted">${fmt('まだありません')}</p>`}</div>`;
  $('#bk').onclick = () => { renderHome(); show('home'); };
  $$('#scr-history button.row').forEach(b => b.onclick = () => startSet(b.dataset.id));
  show('history');
}

/* ---------- 設定 ---------- */
let resetArm = 0;
function renderSettings() {
  const out = store.get('outbox', []);
  $('#scr-settings').innerHTML = `${backBtn()}
    <div class="sectitle">${fmt('{設定|せってい}')}</div>
    <div class="list">
      <div class="set"><label for="s-theme">${fmt('{画面|がめん}の{明|あか}るさ')}</label><select id="s-theme"><option value="auto">スマホに合わせる</option><option value="light">明るい</option><option value="dark">暗い</option></select></div>
      <div class="set"><label for="s-furi">${fmt('ふりがなを{出|だ}す')}</label><input type="checkbox" id="s-furi" ${settings.furi ? 'checked' : ''}></div>
      <div class="set"><label for="s-sound">${fmt('{効果音|こうかおん}')}</label><input type="checkbox" id="s-sound" ${settings.sound ? 'checked' : ''}></div>
      <div class="set"><label for="s-pos">${fmt('「{次|つぎ}へ」ボタンの{場所|ばしょ}')}</label><select id="s-pos"><option value="near">答えの近く</option><option value="bottom">画面の下</option></select></div>
      <div class="set"><label for="s-time">${fmt('{時間|じかん}を{表示|ひょうじ}する')}</label><input type="checkbox" id="s-time" ${settings.showTime ? 'checked' : ''}></div>
      <div class="set"><label for="s-auto">${fmt('{正解|せいかい}したら{自動|じどう}で{次|つぎ}へ')}</label><input type="checkbox" id="s-auto" ${settings.autoNext ? 'checked' : ''}></div>
      <div class="set"><label for="s-rate">${fmt('{読|よ}み{上|あ}げの{速|はや}さ')}</label><select id="s-rate"><option value="0.6">ゆっくり</option><option value="0.8">ふつう</option><option value="1">速い</option></select></div>
      <div class="set"><label for="s-voice">${fmt('{英語|えいご}の{声|こえ}')}</label><select id="s-voice" style="max-width:55%"></select></div>
      <button class="bigbtn ghost" id="s-test">${ICON.speaker.replace('<svg', '<svg width="22" height="22" style="vertical-align:-4px"')} ${fmt('{声|こえ}を{聞|き}いてみる')}</button>
      <div class="set"><label for="s-name">${fmt('{名前|なまえ}')}</label><input id="s-name" value="${esc(settings.name)}" style="font:inherit;width:9em;padding:6px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)"></div>
    </div>
    ${CFG.reportUrl ? `<p class="muted">${fmt(`まだ{送|おく}れていない{記録|きろく}：${out.length}{件|けん}`)}</p>${out.length ? `<button class="bigbtn ghost" id="flush">${fmt('{今|いま}{送|おく}る')}</button>` : ''}` : ''}
    <div class="sectitle"></div>
    <button class="bigbtn ghost danger" id="reset">${fmt('{記録|きろく}を{全部|ぜんぶ}{消|け}す')}</button>`;
  $('#s-rate').value = String(settings.rate);
  fillVoices();
  $('#s-furi').onchange = e => { settings.furi = e.target.checked; saveSettings(); document.body.classList.toggle('hide-furi', !settings.furi); };
  $('#s-sound').onchange = e => { settings.sound = e.target.checked; saveSettings(); };
  $('#s-theme').value = settings.theme || 'auto';
  $('#s-theme').onchange = e => { settings.theme = e.target.value; saveSettings(); applyTheme(); };
  $('#s-pos').value = settings.nextPos === 'bottom' ? 'bottom' : 'near';
  $('#s-pos').onchange = e => { settings.nextPos = e.target.value; saveSettings(); };
  $('#s-auto').onchange = e => { settings.autoNext = e.target.checked; saveSettings(); };
  $('#s-time').onchange = e => { settings.showTime = e.target.checked; saveSettings(); };
  $('#s-rate').onchange = e => { settings.rate = +e.target.value; saveSettings(); say('bird. girl. shirt.'); };
  $('#s-voice').onchange = e => { settings.voice = e.target.value; saveSettings(); pickVoice(); say('bird. girl. shirt.'); };
  $('#s-test').onclick = () => say('Hello! This is a bird. The bird is on the tree.');
  $('#s-name').onchange = e => { settings.name = e.target.value.trim(); saveSettings(); };
  if ($('#flush')) $('#flush').onclick = async () => { await flushOutbox(); renderSettings(); };
  $('#reset').onclick = () => {
    if (Date.now() - resetArm < 3000) { ['log', 'done', 'mistakes', 'stars', 'outbox'].forEach(k => store.set(k, k === 'stars' ? 0 : k === 'log' || k === 'outbox' ? [] : {})); toast('{消|け}しました'); renderHome(); show('home'); return; }
    resetArm = Date.now(); toast('もう{一回|いっかい}{押|お}すと{消|け}します');
  };
  $('#bk').onclick = () => { renderHome(); show('home'); };
  show('settings');
}

/* 英語の声の一覧。パソコンなど声が見つからない端末でも「おまかせ」を選べる */
function fillVoices() {
  const sel = $('#s-voice'); if (!sel) return;
  const vs = enVoices();
  sel.innerHTML = `<option value="auto-us">アメリカ（おまかせ）</option><option value="auto-gb">イギリス（おまかせ）</option>` +
    vs.map(v => `<option value="${esc(v.voiceURI)}">${esc(v.name)}</option>`).join('');
  sel.value = settings.voice && [...sel.options].some(o => o.value === settings.voice) ? settings.voice : 'auto-us';
}

/* ---------- おしまい（結果はシンプルに） ---------- */
function finishQuiz() {
  Q.finished = true; Q.locked = true;
  const idx = Q.list.map((q, i) => i).filter(i => !Q.list[i].practice);
  const scored = idx.length ? idx : Q.list.map((q, i) => i).filter(i => ['say', 'write'].includes(Q.list[i].type));
  const writing = Q.list.map((q, i) => q.type === 'write' && Q.res[i].text ? `【${bare(q.theme)}】${Q.res[i].text}` : '').filter(Boolean).join('\n');
  const n = scored.length, ok = scored.filter(i => Q.res[i].first).length, sec = Math.round((Date.now() - Q.start) / 1000);
  const earned = ok + (Q.mode === 'set' ? 3 : 1);
  const t = today(), firstToday = !getLog().some(l => l.d === t);
  const log = getLog(); log.push({ d: t, t: Q.title, s: Q.subject, n, ok, sec, set: Q.setId, m: Q.mode }); store.set('log', log.slice(-400));
  store.set('stars', store.get('stars', 0) + earned);
  if (Q.setId) { const d = getDone(); d[Q.setId] = { ok, n, d: t }; store.set('done', d); }
  const wrong = scored.filter(i => Q.res[i].first === false).map(i => { const q = Q.list[i]; return q.type === 'say' ? `（発音）${q.word}` : bare(q.blank ? q.blank.word : q.prompt).replace(/\n/g, ' ') + ' → ' + bare([].concat(q.answer).join(' / ')); });
  queueReport({ key: CFG.reportKey || '', name: childName(), date: t, time: new Date().toTimeString().slice(0, 5), mode: Q.mode, set: Q.setId || '', title: Q.title, subject: Q.subject, total: n, correct: ok, sec, stars: earned, wrong: wrong.join(' ｜ '), writing });
  const pct = n ? ok / n : 1, head = pct === 1 ? 'はなまる！' : pct >= .8 ? 'よくできました！' : pct >= .5 ? '{頑張|がんば}ったね！' : '{最後|さいご}までやりきった！';
  sndFin(); buzz([40, 60, 40]);
  $('#scr-result').innerHTML = `<div class="result">
    <div class="bigmaru">${hanamaruSVG('draw')}<div class="score">${ok}</div></div>
    <h2>${fmt(head)}</h2>
    <div class="stargain">${ICON.star}<b>+${earned}</b></div>
    ${settings.showTime ? `<p class="muted">${fmt(`かかった{時間|じかん} ${Math.floor(sec / 60)}{分|ふん}${sec % 60}{秒|びょう}`)}</p>` : ''}
    <div class="btncol"><button class="bigbtn" id="home">${fmt(firstToday ? 'スタンプを{押|お}す' : 'ホームへ')}</button>
      <button class="bigbtn ghost" id="share">${fmt('LINEでパパに{見|み}せる')}</button></div>
  </div>`;
  $('#home').onclick = () => { renderHome(firstToday); show('home'); Q = null; };
  $('#share').onclick = () => shareText(`はなまるノート ${jdate(t)}\n「${Q ? Q.title : ''}」${ok}/${n}問 1回で正解\n連続${streak()}日` + (wrong.length ? `\n間違えた: ${wrong.slice(0, 5).join(' / ')}` : ''));
  show('result');
  if (pct >= .8) confetti();
  flushOutbox();
}
async function shareText(text) {
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('コピーしました。LINEに{貼|は}り{付|つ}けてね'); } catch (e) { toast('コピーできませんでした'); }
}

/* ---------- パパへの報告（Googleスプレッドシート） ---------- */
function queueReport(p) { if (!CFG.reportUrl) return; const o = store.get('outbox', []); o.push(p); store.set('outbox', o.slice(-200)); }
async function flushOutbox() {
  if (!CFG.reportUrl) return false;
  let o = store.get('outbox', []); if (!o.length) return true;
  try {
    await fetch(CFG.reportUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: CFG.reportKey || '', rows: o }) });
    store.set('outbox', []); return true;
  } catch (e) { return false; }
}

/* ---------- 紙ふぶき ---------- */
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), x = c.getContext('2d'); c.hidden = false;
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const cs = getComputedStyle(document.documentElement), cols = ['--red', '--gold', '--math', '--eng', '--dot-b'].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: 110 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 22, vy: -Math.random() * 26 - 8, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, s: (6 + Math.random() * 8) * devicePixelRatio, c: pick(cols) }));
  let f = 0;
  (function step() {
    x.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .6; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 150) requestAnimationFrame(step); else { x.clearRect(0, 0, W, H); c.hidden = true; }
  })();
}

/* ---------- 起動 ---------- */
(async function boot() {
  document.body.classList.toggle('hide-furi', !settings.furi);
  $('#scr-home').innerHTML = '<p class="muted" style="padding:40px 0;text-align:center">' + fmt('{読|よ}み{込|こ}み{中|ちゅう}…') + '</p>';
  await loadData();
  renderHome(); show('home');
  flushOutbox();
  if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();

</script>
